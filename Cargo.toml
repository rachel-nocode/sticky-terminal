[package]
name = "sticky-terminal"
version = "1.0.0"
edition = "2021"
description = "A tiny always-on-top terminal that looks like a paper sticky note."
license = "MIT"
repository = "https://github.com/rachel-nocode/sticky-terminal"
readme = "README.md"
keywords = ["terminal", "desktop", "egui", "sticky-note", "pty"]
categories = ["command-line-utilities"]

# The `objc` crate's macros trip the unexpected_cfgs lint — silence the noise.
[lints.rust]
unexpected_cfgs = "allow"

[package.metadata.bundle]
name = "StickyTerminal"
identifier = "com.witchaudio.stickyterminal"
icon = ["assets/macos/StickyTerminal.icns"]

[dependencies]
eframe = "0.33.3"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vt100 = "0.16.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
